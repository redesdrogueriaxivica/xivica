# Revisa el sitio en cada cambio.
#
# Existe porque quien edita el catálogo es un asistente conversando con el
# dueño de la droguería: una coma mal puesta en el JSON dejaría la tienda en
# blanco para todos los visitantes. Si algo está mal, este trabajo falla, el
# despliegue no ocurre, y el sitio publicado sigue funcionando como estaba.
name: Revisar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # excel_catalogo.py necesita openpyxl. Con el Python del sistema pip se
      # niega a instalar, por eso se usa el de setup-python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de Python (catálogo en Excel)
        run: python3 -m pip install -r tools/requirements.txt

      - name: Revisar el catálogo
        run: python3 tools/validar.py src/datos/productos.json public/img

      - name: Revisar que las variables de CSS existan
        run: python3 tools/revisar-css.py

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      # No se compara contra un número fijo: el catálogo cambia de tamaño con
      # el tiempo (se borran productos descontinuados, se agregan otros). Lo
      # que de verdad importa es que cada producto del catálogo tenga su
      # propia página; si dos comparten el mismo slug, Astro genera una sola
      # página para los dos y el número de fichas queda por debajo del
      # catálogo.
      - name: Comprobar que cada producto tiene su propia ficha
        run: |
          productos=$(python3 -c "import json; print(len(json.load(open('src/datos/productos.json', encoding='utf-8'))))")
          fichas=$(ls dist/producto | wc -l)
          echo "Productos en el catálogo: $productos"
          echo "Fichas generadas: $fichas"
          if [ "$fichas" -ne "$productos" ]; then
            echo "Hay $productos productos en el catálogo pero se generaron $fichas fichas."
            echo "Suele significar que dos productos comparten el mismo slug."
            exit 1
          fi
